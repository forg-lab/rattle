<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181d'/%3E%3Cpath d='M6 21c3-11 5.5-11 8.5 0s5.5 11 8.5 0' stroke='%237ee0c0' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>rattle</title>
    <!-- Must run before anything else: adds COOP/COEP on hosts that cannot. -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <canvas id="viz" aria-hidden="true"></canvas>
    <div id="app">
      <header>
        <span class="logo">rattle</span>
        <button id="run" class="primary">Run <kbd id="kbd-run"></kbd></button>
        <button id="stop">Stop <kbd id="kbd-stop"></kbd></button>
        <select id="demo" title="load a demo"></select>
        <button id="viz-toggle" title="visuals (⌘⇧V)">visuals</button>
        <label id="code-fade" title="fade the code to see more of the visuals (⌘\ hides it entirely)">
          <span>code</span>
          <input id="code-opacity" type="range" min="0" max="100" value="100" />
        </label>
        <span class="spacer"></span>
        <span id="clock" class="meter">0.00s</span>
        <span id="ahead" class="meter" title="how far the least advanced thread is ahead of the audio clock; negative means underrun">headroom 0ms</span>
        <span id="status" class="status">booting…</span>
        <div class="menu">
          <button id="settings-btn" title="settings" aria-haspopup="true"
                  aria-expanded="false">&#9881;</button>
          <div id="settings" class="popover" hidden>
            <label><input type="checkbox" id="pref-linenumbers" /> line numbers</label>
            <label><input type="checkbox" id="pref-logmin" /> minimise the log</label>
          </div>
        </div>
        <a class="docs" href="./docs.html">docs</a>
      </header>
      <main>
        <div id="editor"></div>
        <aside>
          <div class="pane-title">
            <span class="pane-name">log</span>
            <button id="log-toggle" title="minimise the log (⌘⇧L)"
                    aria-label="minimise the log">›</button>
          </div>
          <div id="log"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
